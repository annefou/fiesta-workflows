name: Test FIESTA Galaxy workflows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    name: Tier 1 smoke test (${{ matrix.workflow }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workflow:
          - decrop-reproduction
          - astro-synthesis
          - sst-gap-filling
          - sst-wgs84-gap-filling
          - bio-stacking
    steps:
      - name: Checkout fiesta-workflows
        uses: actions/checkout@v4
        with:
          path: fiesta-workflows

      - name: Checkout annefou/galaxy-tools fork
        uses: actions/checkout@v4
        with:
          repository: annefou/galaxy-tools
          path: galaxy-tools
          fetch-depth: 0       # we need the four feature branches
          ref: master

      - name: Assemble all 4 FIESTA tools into one directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/fiesta-tools
          cd galaxy-tools
          for b in scattering-stacking planktonclas-inference foscat-features foscat-synthesis; do
            # Each branch has a tool subdir whose name matches the branch.
            git archive "origin/$b" "tools/$b" | tar -x -C $GITHUB_WORKSPACE/fiesta-tools --strip-components=1
          done
          ls -la $GITHUB_WORKSPACE/fiesta-tools

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install planemo
        run: pip install planemo

      - name: Run smoke test for ${{ matrix.workflow }}
        working-directory: fiesta-workflows/workflows/${{ matrix.workflow }}
        run: |
          if [ ! -f "${{ matrix.workflow }}.gxwf.yml" ]; then
            echo "Workflow ${{ matrix.workflow }} not yet implemented — skipping."
            exit 0
          fi
          # Use conda resolution: scattering-stacking needs scikit-learn/joblib
          # via its <requirement> block. The FOSCAT-based tools and
          # planktonclas-inference also declare minimal conda deps (python,
          # pip, numpy, pillow) and pip-install heavier deps in <command>.
          # Conda resolution covers both patterns.
          planemo test \
            --extra_tools "$GITHUB_WORKSPACE/fiesta-tools" \
            --conda_dependency_resolution \
            "${{ matrix.workflow }}.gxwf.yml"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.workflow }}
          path: |
            fiesta-workflows/workflows/${{ matrix.workflow }}/tool_test_output.html
            fiesta-workflows/workflows/${{ matrix.workflow }}/tool_test_output.json
          if-no-files-found: ignore
