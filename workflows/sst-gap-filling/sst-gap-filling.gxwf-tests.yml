- doc: |
    Tier 1 smoke test — gap-filling on a tiny NSIDE=4 HEALPix
    Gaussian random field with synthetic ocean (~75%) and cloud (~25%)
    masks. Exercises the foscat-synthesis tool's healpix + grd_mask
    code path (the same path used by the canonical SST chain).
  job:
    target_map:    {class: File, path: test-data/target.npy}
    starting_map:  {class: File, path: test-data/starting.npy}
    eval_mask:     {class: File, path: test-data/eval_mask.npy}
    update_mask:   {class: File, path: test-data/update_mask.npy}
    norient: 4
    kernelsz: 3
    nsteps: 20
    seed: 1234
  outputs:
    filled_map:
      asserts:
        has_size:
          min: 100
          max: 100000
    results_json:
      asserts:
        has_text:
          text: '"used_update_mask": true'
