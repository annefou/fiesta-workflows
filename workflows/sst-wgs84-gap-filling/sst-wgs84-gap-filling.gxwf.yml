class: GalaxyWorkflow
label: FIESTA-SST-WGS84 — scattering-transform gap-filling on WGS84-ellipsoid HEALPix
doc: |
  Reproduces the WGS84-ellipsoid variant of the SST gap-filling chain
  from github.com/annefou/fiesta-scattering-sst-healpix-geo: same
  algorithm as the standard sst-gap-filling workflow, but the input
  data has been resampled to HEALPix on the WGS84 ellipsoid
  (using healpix-geo + healpix-resample) rather than a perfect sphere.

  Research question: does accounting for Earth's WGS84 ellipsoid
  geometry when resampling SST data to HEALPix improve FOSCAT
  gap-filling accuracy compared to the standard spherical assumption?

  Compare the RMSE results of this workflow against sst-gap-filling
  to answer.

  Method reference: Delouis et al. 2022, A&A 668, A122
  (10.1051/0004-6361/202244566)

inputs:
  target_map:
    type: data
    doc: Reference SST map (L4 gap-free product) resampled to WGS84 HEALPix
  starting_map:
    type: data
    doc: Starting SST map (L3S + harmonic baseline) resampled to WGS84 HEALPix
  eval_mask:
    type: data
    doc: Ocean mask resampled to WGS84 HEALPix
  update_mask:
    type: data
    doc: Cloud mask resampled to WGS84 HEALPix
  norient:
    type: integer
    default: 4
  kernelsz:
    type: integer
    default: 3
  nsteps:
    type: integer
    default: 300
  seed:
    type: integer
    default: 1234

steps:
  synthesis:
    tool_id: foscat_synthesis
    in:
      target_map: target_map
      starting_map: starting_map
      eval_mask: eval_mask
      update_mask: update_mask
      domain: {default: healpix}
      norient: norient
      kernelsz: kernelsz
      nsteps: nsteps
      seed: seed
    out:
      - out_foscat_synthesis_synthesis
      - out_foscat_synthesis_results

outputs:
  filled_map:
    outputSource: synthesis/out_foscat_synthesis_synthesis
  results_json:
    outputSource: synthesis/out_foscat_synthesis_results
